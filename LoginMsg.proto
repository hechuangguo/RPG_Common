// @file LoginMsg.proto
// @brief 登录域 wire message（module=LOGIN/0x00）
// sub 枚举见 LoginCommon.proto

syntax = "proto3";

package rpg.login;

import "ClientCommon.proto";
import "LoginCommon.proto";

option csharp_namespace = "Rpg.Proto.Login";

// 角色列表单条
message UserListEntry {
  uint64 user_id = 1;   // 角色 ID
  string name = 2;      // 角色名 UTF-8
  uint32 level = 3;     // 等级
  uint32 vocation = 4;  // 职业
  uint32 sex = 5;       // 性别
}

// C→S module=0x00 sub=0x01
message C2SLoginReq {
  string account = 1;
  bytes password_digest = 2; // SHA-256(UTF-8 密码) 32 字节；不含 nonce
  uint32 zone_id = 3;
  uint32 game_type = 4;
  rpg.client.ProtocolVersion protocol_version = 5;
  bytes login_nonce = 7;     // 回显 S2CLoginChallenge.nonce（16 字节）
}

// S→C module=0x00 sub=0x10；LoginServer 连接后下发，单次连接有效
message S2CLoginChallenge {
  bytes nonce = 1; // 16 字节随机数
}

// S→C module=0x00 sub=0x02；仅 LoginServer 9010 账号登录结果
message S2CLoginRsp {
  int32 code = 1;
  string msg = 2;
  uint64 user_id = 3;
  uint64 accid = 4;
  string login_token = 5;
  uint64 token_expire_ms = 6;
}

// C→S module=0x00 sub=0x03
message C2SRegisterReq {
  string account = 1;
  bytes password_digest = 2;           // SHA-256(UTF-8 密码) 32 字节；不含 nonce
  bytes confirm_password_digest = 3;   // 同 password_digest
  uint32 zone_id = 4;
  uint32 game_type = 5;
  rpg.client.ProtocolVersion protocol_version = 6;
  bytes login_nonce = 7;             // 回显 S2CLoginChallenge.nonce（16 字节）
}

// S→C module=0x00 sub=0x04
message S2CRegisterRsp {
  int32 code = 1;
  string msg = 2;
  uint64 accid = 3;
}

// C→S module=0x00 sub=0x0D；Gateway 鉴权。body 为纯 Protobuf（禁止 wire v2 定长前缀）
message C2SGatewayAuthReq {
  string account = 1;
  string login_token = 2;
  uint32 zone_id = 3;
  uint32 game_type = 4;
  rpg.client.ProtocolVersion protocol_version = 5;
}

// C→S module=0x00 sub=0x05；选角进世界。body 为纯 Protobuf
message C2SSelectUserReq {
  uint64 user_id = 1;
  uint64 login_txn_id = 2;
}

// S→C module=0x00 sub=0x06
message S2CUserList {
  int32 code = 1;
  repeated UserListEntry entries = 2;
}

// C→S module=0x00 sub=0x07；创角。body 为纯 Protobuf
message C2SCreateUserReq {
  string name = 1;     // 2–12 码点 UTF-8
  uint32 vocation = 2;
  uint32 sex = 3;
}

// S→C module=0x00 sub=0x08
message S2CCreateUserRsp {
  int32 code = 1;
  string msg = 2;
  uint64 user_id = 3;
}

// S→C module=0x00 sub=0x0A
message S2CGatewayInfo {
  int32 code = 1;
  string gateway_ip = 2;
  uint32 gateway_port = 3;
  string msg = 4;
}

// S→C module=0x00 sub=0x11；Gateway 票据鉴权结果
message S2CGatewayAuthRsp {
  int32 code = 1;
  string msg = 2;
  uint64 accid = 3;
}

// S→C module=0x00 sub=0x12；选角进世界结果（成功时另发 S2C_ENTER_GAME）
message S2CEnterWorldRsp {
  int32 code = 1;
  string msg = 2;
  uint64 user_id = 3;
}

// S→C module=0x00 sub=0x09
message S2CEnterGame {
  uint64 user_id = 1;
  string name = 2;
  uint32 map_id = 3;
  rpg.client.Vec3 pos = 4;
  uint32 level = 5;
  uint32 hp = 6;
  uint32 max_hp = 7;
  uint32 mp = 8;
  uint32 max_mp = 9;
}

// C→S module=0x00 sub=0x0E；离世界/退出。body 为纯 Protobuf
message C2SLogoutReq {
  LogoutAction action = 1;
}

// S→C module=0x00 sub=0x0F
message S2CLogoutRsp {
  int32 code = 1;
  LogoutAction action = 2;
  string msg = 3;
}
