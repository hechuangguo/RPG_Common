// @file ZoneMsg.proto
// @brief 区服域 wire message（module=LOGIN/0x00）
// sub 见 ZoneCommon.proto

syntax = "proto3";

package rpg.zone;

import "ZoneCommon.proto";

option csharp_namespace = "Rpg.Proto.Zone";

message ZoneEntry {
  uint32 zone_id = 1;
  uint32 game_type = 2;
  uint32 enabled = 3;       // 1=可进入
  string name = 4;
  string ip = 5;
  uint32 super_port = 6;
  uint32 online_count = 7;
  ZoneLoadLevel load_level = 8;
  uint32 gateway_count = 9;
}

// C→S module=0x00 sub=0x0B
message C2SZoneListReq {
  uint32 game_type = 1; // 0xFF=全部
}

// S→C module=0x00 sub=0x0C
message S2CZoneListRsp {
  int32 code = 1;
  repeated ZoneEntry entries = 2;
}
